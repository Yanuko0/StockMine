# 全球強勢族群：美股收盤後（台灣早上約 5:40）抓美 / 日 / 韓股收盤，算最強族群並對應台股
# 只保留最新一天（app_settings.global_themes 每天覆蓋）
name: 全球強勢族群

on:
  schedule:
    - cron: "40 21 * * 1-5"   # 台灣時間週二～週六 05:40（美股週一～週五收盤後）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy httpx "psycopg[binary]"
      - run: python -m twstock.cli global
