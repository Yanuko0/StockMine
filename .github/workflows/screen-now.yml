# 網頁儲存策略 / 按「立即選股」時觸發：盤中用盤中資料，盤後用最新收盤資料，只跑那一個策略
name: 立即選股

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "策略 ID"
        required: true

concurrency:
  group: screen-now-${{ inputs.strategy }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
  SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: 還原分鐘K 快取（只讀）
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache/m1
          key: m1-${{ github.run_id }}
          restore-keys: m1-
      - env:
          STRATEGY: ${{ inputs.strategy }}
        run: python -m twstock.cli screen-now --strategy "$STRATEGY"
