# 網頁儲存策略 / 按「立即選股」時觸發：盤中用盤中資料，盤後用最新收盤資料，只跑那一個策略
name: 立即選股

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "策略 ID"
        required: true

concurrency:
  group: screen-now-${{ inputs.strategy }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
  SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      # 只裝盤中選股用得到的套件（不裝驗證碼辨識、Google 這些大套件，省 30 秒以上）
      - run: pip install pandas numpy httpx "psycopg[binary]" pyarrow shioaji pywebpush
      - name: 今天日期（台灣時間）
        run: echo "TODAY=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_ENV"
      - name: 還原今天盤中抓過的分K（立即選股可以直接沿用，不用逐檔重抓）
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache/live
          key: live-${{ env.TODAY }}-${{ github.run_id }}
          restore-keys: live-${{ env.TODAY }}-
      - name: 還原分鐘K 快取（只讀）
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache/m1
          key: m1-${{ github.run_id }}
          restore-keys: m1-
      - env:
          STRATEGY: ${{ inputs.strategy }}
        run: rm -f .cache/live/.fresh && python -m twstock.cli screen-now --strategy "$STRATEGY"
      - name: 存今天的盤中分K（有重新抓才存）
        if: always() && hashFiles('pipeline/.cache/live/.fresh') != ''
        uses: actions/cache/save@v4
        with:
          path: pipeline/.cache/live
          key: live-${{ env.TODAY }}-${{ github.run_id }}
