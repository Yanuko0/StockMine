# 全球強勢族群：台股開盤前整理「昨晚美股收盤 + 昨天日韓收盤」，算最強族群並對應台股
# 早上排 4 次（05:10 / 06:10 / 07:10 / 08:10）：GitHub 排程常延遲，任何一次跑到就會是正確的那一天，
# 重複跑結果一樣（只保留最新一份）。週一早上用的是上週五的收盤。
name: 全球強勢族群

on:
  schedule:
    - cron: "10 21,22,23 * * *"   # 台灣時間 05:10、06:10、07:10
    - cron: "10 0 * * *"          # 台灣時間 08:10
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy httpx "psycopg[binary]"
      - run: python -m twstock.cli global
