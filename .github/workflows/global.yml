# 全球強勢族群：抓美 / 日 / 韓股「最近一個收完的交易日」，算最強族群並對應台股
# 每 2 小時跑一次（GitHub 排程常延遲好幾小時，多跑幾次才能保證是最新的）；只保留最新一份
name: 全球強勢族群

on:
  schedule:
    - cron: "40 */2 * * *"   # 每 2 小時（美股收盤後第一次跑到就會換成最新）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy httpx "psycopg[binary]"
      - run: python -m twstock.cli global
